[project]
name = "firetext2sql"
version = "0.1.0"
description = "Text-to-SQL agent on Fireworks AI"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
 "ipython",
 "pandas",
 "pydantic",
 "python-dotenv",
]

[project.scripts]
cli = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
