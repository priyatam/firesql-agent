[project]
name = "firetext2sql"
version = "0.1.0"
description = "Text-to-SQL agent on Fireworks AI"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
 "ipython",
 "pandas",
 "pydantic",
 "python-dotenv",
 "sqlalchemy>=2.0",
 "strands-agents[openai]==1.67.0",
]

[project.scripts]
cli = "src.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
mysql = [
    "pymysql>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
